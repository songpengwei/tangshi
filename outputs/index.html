<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全唐诗名家诗作语义图谱</title>
<style>
  :root {
    --blue: #77AAC2; --green: #79D9CE; --yellow: #FCD765;
    --red: #F19A97; --dark: #696773; --light: #EFF1F3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--light); color: var(--dark);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    background: var(--dark); color: var(--light);
    padding: 10px 20px; display: flex; align-items: center; gap: 16px;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
  header .sub { font-size: 12px; opacity: .65; }
  #legend {
    display: flex; flex-wrap: wrap; gap: 4px 8px; padding: 8px 20px;
    background: #fff; border-bottom: 1px solid #e2e4e7; flex-shrink: 0;
  }
  #legend .chip {
    display: flex; align-items: center; gap: 4px; font-size: 11px;
    padding: 2px 8px; border-radius: 999px; cursor: pointer;
    border: 1px solid transparent;
  }
  #legend .chip:hover { border-color: #d5d8dc; }
  #legend .chip.active { border-color: var(--dark); font-weight: 600; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #legend .chip .n { color: #9a98a3; font-size: 10px; }
  main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap { flex: 1; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; cursor: crosshair; }
  #panel {
    width: 360px; flex-shrink: 0; background: #fff; border-left: 1px solid #e2e4e7;
    padding: 20px; overflow-y: auto;
  }
  #panel .placeholder { color: #9a98a3; font-size: 13px; margin-top: 40px; text-align: center; line-height: 2; }
  #panel .clusterChip {
    display: inline-block; font-size: 12px; color: #fff;
    padding: 2px 10px; border-radius: 999px; margin-bottom: 12px;
  }
  #panel h2 { font-size: 17px; line-height: 1.5; margin-bottom: 4px; }
  #panel .author { font-size: 13px; color: var(--blue); margin-bottom: 10px; font-weight: 600; }
  #panel .facts { font-size: 12px; color: #9a98a3; margin-bottom: 14px; line-height: 1.8; }
  #panel .facts .tag {
    display: inline-block; background: var(--light); border-radius: 4px;
    padding: 0 6px; margin-right: 4px; color: var(--dark);
  }
  #panel .content { margin-bottom: 14px; border-left: 3px solid var(--yellow); padding-left: 12px; }
  #panel .content .row {
    display: flex; gap: 0 1.8em;
    font-size: 14px; line-height: 2.0; letter-spacing: 1px;
  }
  #panel .fineChips {
    display: flex; flex-wrap: wrap; gap: 4px 6px; margin-bottom: 12px;
    padding-bottom: 10px; border-bottom: 1px dashed #e2e4e7;
  }
  #panel .fineChips .fc {
    font-size: 11px; padding: 1px 8px; border-radius: 999px; cursor: pointer;
    background: var(--light); color: var(--dark); border: 1px solid transparent;
  }
  #panel .fineChips .fc:hover { border-color: #d5d8dc; }
  #panel .fineChips .fc.active { border-color: var(--dark); font-weight: 600; }
  #panel .fineChips .fc .n { color: #9a98a3; margin-left: 2px; }
  #panel .bio {
    font-size: 12px; line-height: 1.9; color: #7b7987;
    border-top: 1px dashed #e2e4e7; padding-top: 12px;
  }
  #panel .bio b { color: var(--dark); }
  #panel .bio .toggle {
    color: var(--blue); cursor: pointer; margin-left: 6px; user-select: none;
  }
  #panel .bio .toggle:hover { text-decoration: underline; }
  #panel .locked {
    margin-top: 12px; font-size: 12px; color: var(--red);
    border-top: 1px dashed #e2e4e7; padding-top: 10px;
  }
  #panel .loading { font-size: 12px; color: #9a98a3; margin-top: 16px; }

  @media (max-width: 700px) {
    body { min-height: 100dvh; height: auto; overflow: auto; }
    header { padding: 9px 12px; gap: 8px; }
    header h1 {
      min-width: 0; flex: 1; overflow: hidden; white-space: nowrap;
      text-overflow: ellipsis; font-size: 15px; line-height: 1.2; letter-spacing: 0;
    }
    header .sub {
      flex: 0 1 42%; overflow: hidden; text-overflow: ellipsis;
      font-size: 10px; white-space: nowrap;
    }
    #legend { max-height: 84px; overflow-y: auto; padding: 6px 10px; gap: 3px 5px; }
    #legend .chip { font-size: 10px; padding: 2px 6px; }
    main { display: block; min-height: 0; }
    #canvasWrap {
      height: clamp(320px, 52dvh, 520px);
      width: 100%;
    }
    #panel {
      width: 100%;
      min-height: 240px;
      max-height: none;
      border-left: 0;
      border-top: 1px solid #e2e4e7;
      padding: 14px;
      overflow: visible;
    }
  }
</style>
</head>
<body>
<header>
  <h1>全唐诗名家诗作语义图谱</h1>
  <span class="sub" id="sub">加载中…</span>
</header>
<div id="legend"></div>
<main>
  <div id="canvasWrap"><canvas id="cv"></canvas></div>
  <div id="panel"><div class="placeholder">移动鼠标查看诗作<br>点击点位锁定，或点击上方主题高亮一类<br>再次点击取消</div></div>
</main>
<script>
// 木鸟配色派生的 20 主题色
const MACRO_COLORS = [
  "#F19A97", "#77AAC2", "#79D9CE", "#FCD765", "#8B87A0",
  "#E8847F", "#5C93AF", "#5CC8BB", "#E8C24A", "#696773",
  "#F5B3AE", "#99C2D4", "#9CE6DD", "#E5B93E", "#57526B",
  "#C97B72", "#3F7A96", "#4BA99E", "#D9A05B", "#9E99B3",
];

let POEMS = [];       // 轻量点位: {i,t,a,tx,ty,m,f}
let MACRO_NAMES = []; // 主题 id -> 名称
let MACROS = [];      // /api/points 返回的主题完整信息（含 fines）
let FINE_MEMBERS = {};// 细类 id -> [点位下标]
let N_MACRO = 0;

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const wrap = document.getElementById("canvasWrap");
const panel = document.getElementById("panel");

let hoverIdx = -1;
let lockIdx = -1;
let lockedMacro = -1;
const chips = [];

// ---- 详情按需加载（缓存 + 防抖） ----
const detailCache = new Map();   // id -> detail
const pendingFetch = new Map();  // id -> Promise
function fetchDetail(id) {
  if (detailCache.has(id)) return Promise.resolve(detailCache.get(id));
  if (pendingFetch.has(id)) return pendingFetch.get(id);
  const p = fetch(`/api/poem?id=${id}`)
    .then(r => r.json())
    .then(d => { detailCache.set(id, d); pendingFetch.delete(id); return d; })
    .catch(() => { pendingFetch.delete(id); return null; });
  pendingFetch.set(id, p);
  return p;
}

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255,
        g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hslToHex(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)),
        m = l - c / 2;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x]; else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  const to = v => Math.round((v + m) * 255).toString(16).padStart(2, "0");
  return "#" + to(r) + to(g) + to(b);
}

let FINE_RANK = {};  // fine id -> {rank, count}，同主题内细类明暗分层
function fineColor(p) {
  const [h, s, l] = hexToHsl(MACRO_COLORS[p.m]);
  const {rank, count} = FINE_RANK[p.f];
  const spread = count > 1 ? (rank / (count - 1) - 0.5) : 0;
  const nl = Math.min(0.85, Math.max(0.3, l + spread * 0.25));
  return hslToHex(h, s, nl);
}

// ---- 布局 ----
let scale = { k: 1, x0: 0, y0: 0, w: 0, h: 0 };
function fitScale() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const pad = 30;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of POEMS) {
    if (p.tx < minX) minX = p.tx; if (p.tx > maxX) maxX = p.tx;
    if (p.ty < minY) minY = p.ty; if (p.ty > maxY) maxY = p.ty;
  }
  const k = Math.min((w - 2 * pad) / (maxX - minX), (h - 2 * pad) / (maxY - minY));
  scale = {
    k, w, h,
    x0: pad - minX * k + ((w - 2 * pad) - (maxX - minX) * k) / 2,
    y0: pad + maxY * k + ((h - 2 * pad) - (maxY - minY) * k) / 2,
  };
}
function toScreen(p) {
  return [scale.x0 + p.tx * scale.k, scale.y0 - p.ty * scale.k];
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = wrap.clientWidth * dpr;
  cv.height = wrap.clientHeight * dpr;
  cv.style.width = wrap.clientWidth + "px";
  cv.style.height = wrap.clientHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fitScale();
  draw();
}

// ---- 绘制 ----
function draw() {
  ctx.clearRect(0, 0, scale.w, scale.h);
  const locking = lockedMacro >= 0;
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < POEMS.length; i++) {
      const p = POEMS[i];
      const hot = !locking || p.m === lockedMacro;
      if ((pass === 1) !== hot) continue;
      const [x, y] = toScreen(p);
      ctx.globalAlpha = locking && !hot ? 0.08 : 0.85;
      ctx.fillStyle = fineColor(p);
      ctx.beginPath();
      ctx.arc(x, y, locking && hot ? 3 : 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (const [idx, r] of [[hoverIdx, 5], [lockIdx, 8]]) {
    if (idx < 0) continue;
    const [x, y] = toScreen(POEMS[idx]);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fineColor(POEMS[idx]);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
  }
}

// ---- 右侧面板 ----
const BIO_LIMIT = 140;

function panelSkeleton(p, locked) {
  panel.innerHTML = `
    <span class="clusterChip" style="background:${MACRO_COLORS[p.m]}">${MACRO_NAMES[p.m]}</span>
    <h2>《${p.t}》</h2>
    <div class="author">${p.a}</div>
    <div class="loading">加载详情…</div>
    ${locked ? '<div class="locked">已锁定：同主题高亮中，再次点击取消</div>' : ''}
  `;
}

function poemRows(paragraphs) {
  // 源数据每个 paragraph 含两句（"xxx，xxx。"）：拆成两句，一行两列
  const rows = [];
  for (const para of paragraphs) {
    const clauses = para.split(/(?<=[，。！？；])/).filter(c => c.trim());
    if (clauses.length <= 1) {
      rows.push(`<div class="row single"><span>${para}</span></div>`);
    } else {
      rows.push(`<div class="row">${clauses.map(c => `<span>${c}</span>`).join("")}</div>`);
    }
  }
  return rows.join("");
}

function bioHtml(bio) {
  if (!bio) return "";
  if (bio.length <= BIO_LIMIT) return `<div class="bio"><b>诗人小传</b>　${bio}</div>`;
  return `<div class="bio"><b>诗人小传</b>　<span id="bioText">${bio.slice(0, BIO_LIMIT)}…</span><span class="toggle" id="bioToggle">展开全文</span></div>`;
}

function fineChipsHtml(macro, activeFine) {
  // 主题锁定时列出其下所有细类，点击跳转该类随机一首
  const m = MACROS[macro];
  if (!m || !m.fines || m.fines.length === 0) return "";
  const items = m.fines.map(f =>
    `<span class="fc${f.id === activeFine ? " active" : ""}" data-fine="${f.id}">${f.name}<span class="n">${f.count}</span></span>`
  ).join("");
  return `<div class="fineChips">${items}</div>`;
}

function bindFineChips() {
  panel.querySelectorAll(".fineChips .fc").forEach(el => {
    el.onclick = () => {
      const members = FINE_MEMBERS[Number(el.dataset.fine)] || [];
      if (members.length) lock(members[Math.floor(Math.random() * members.length)]);
    };
  });
}

function renderDetail(d, locked) {
  panel.innerHTML = `
    <span class="clusterChip" style="background:${MACRO_COLORS[d.macro]}">${d.macro_name}</span>
    ${locked ? fineChipsHtml(d.macro, d.fine) : ""}
    <h2>《${d.title}》</h2>
    <div class="author">${d.author}${d.era ? " · " + d.era : ""}</div>
    <div class="facts">${[d.form, `${d.fine_name}（细类 ${d.fine}）`, ...d.tags.map(t => `<span class="tag">${t}</span>`)].filter(Boolean).join(" ")}</div>
    <div class="content">${poemRows(d.paragraphs)}</div>
    ${bioHtml(d.bio)}
    ${locked ? '<div class="locked">已锁定：同主题高亮中，再次点击取消</div>' : ''}
  `;
  bindFineChips();
  const toggle = document.getElementById("bioToggle");
  if (toggle) {
    let expanded = false;
    toggle.onclick = () => {
      expanded = !expanded;
      document.getElementById("bioText").textContent = expanded ? d.bio : d.bio.slice(0, BIO_LIMIT) + "…";
      toggle.textContent = expanded ? "收起" : "展开全文";
    };
  }
}

// 面板刷新：只有仍然是当前展示对象时才更新
function showPoem(i, locked) {
  const p = POEMS[i];
  if (detailCache.has(p.i)) { renderDetail(detailCache.get(p.i), locked); return; }
  panelSkeleton(p, locked);
  fetchDetail(p.i).then(d => {
    if (!d) return;
    const current = lockIdx >= 0 ? lockIdx : hoverIdx;
    if (current === i) renderDetail(d, locked);
  });
}

// ---- 锁定/解锁 ----
let MACRO_MEMBERS = [];
function lock(i) {
  lockIdx = i;
  lockedMacro = POEMS[i].m;
  chips.forEach((chip, m) => chip.classList.toggle("active", m === lockedMacro));
  showPoem(i, true);
  draw();
}
function unlock() {
  lockIdx = -1; lockedMacro = -1;
  chips.forEach(chip => chip.classList.remove("active"));
  if (hoverIdx >= 0) showPoem(hoverIdx, false);
  else panel.innerHTML = '<div class="placeholder">移动鼠标查看诗作<br>点击点位锁定，或点击上方主题高亮一类<br>再次点击取消</div>';
  draw();
}

// ---- 交互 ----
function nearest(mx, my) {
  let best = -1, bestD = 64;
  for (let i = 0; i < POEMS.length; i++) {
    const [x, y] = toScreen(POEMS[i]);
    const d = (x - mx) * (x - mx) + (y - my) * (y - my);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

cv.addEventListener("mousemove", e => {
  const rect = cv.getBoundingClientRect();
  const i = nearest(e.clientX - rect.left, e.clientY - rect.top);
  if (i === hoverIdx) return;
  hoverIdx = i;
  cv.style.cursor = i >= 0 ? "pointer" : "crosshair";
  draw();
  if (lockIdx < 0 && i >= 0) showPoem(i, false);
});

cv.addEventListener("click", e => {
  const rect = cv.getBoundingClientRect();
  const i = nearest(e.clientX - rect.left, e.clientY - rect.top);
  if (lockIdx >= 0 && (i === lockIdx || i < 0)) unlock();
  else if (i >= 0) lock(i);
});

cv.addEventListener("mouseleave", () => { hoverIdx = -1; draw(); });

window.addEventListener("resize", resize);

// ---- 初始化 ----
fetch("/api/points").then(r => r.json()).then(data => {
  MACRO_NAMES = data.macros.map(m => m.name);
  MACROS = data.macros;
  N_MACRO = data.macros.length;
  POEMS = data.points.map(([i, t, a, tx, ty, m, f]) => ({ i, t, a, tx, ty, m, f }));

  document.getElementById("sub").textContent =
    `${POEMS.length} 首 · Qwen3-Embedding-0.6B · KMeans k=100→20 · PCA→t-SNE · SQLite`;

  MACRO_MEMBERS = Array.from({ length: N_MACRO }, () => []);
  POEMS.forEach((p, idx) => {
    MACRO_MEMBERS[p.m].push(idx);
    (FINE_MEMBERS[p.f] = FINE_MEMBERS[p.f] || []).push(idx);
  });
  for (let m = 0; m < N_MACRO; m++) {
    const fines = [...new Set(POEMS.filter(p => p.m === m).map(p => p.f))].sort((a, b) => a - b);
    fines.forEach((f, r) => FINE_RANK[f] = { rank: r, count: fines.length });
  }

  const legend = document.getElementById("legend");
  const sorted = [...data.macros].sort((a, b) => b.count - a.count);
  for (const m of sorted) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<span class="dot" style="background:${MACRO_COLORS[m.id]}"></span>${m.name}<span class="n">${m.count}</span>`;
    chip.onclick = () => {
      if (lockedMacro === m.id) { unlock(); return; }
      const members = MACRO_MEMBERS[m.id];
      lock(members[Math.floor(Math.random() * members.length)]);
    };
    legend.appendChild(chip);
    chips[m.id] = chip;  // chips 按下标=主题 id 访问，与显示顺序无关
  }
  resize();
});
</script>
</body>
</html>
