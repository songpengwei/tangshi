<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唐诗地图 · 不知道读什么时，就来这里走走</title>
<style>
  :root {
    --blue: #77AAC2; --green: #79D9CE; --yellow: #FCD765;
    --red: #F19A97; --dark: #696773; --light: #EFF1F3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }  /* 防止自定义 display 覆盖 hidden */
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--light); color: var(--dark);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    background: var(--dark); color: var(--light);
    padding: 10px 20px; display: flex; align-items: center; gap: 16px;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
  header .sub { font-size: 12px; opacity: .65; flex: 1; }
  #routeSel {
    background: transparent; color: var(--light); cursor: pointer;
    border: 1px solid rgba(239, 241, 243, .35); border-radius: 999px;
    font-size: 12px; padding: 3px 10px; flex-shrink: 0;
  }
  #routeSel option { color: var(--dark); }
  #legend {
    display: flex; flex-wrap: wrap; gap: 4px 8px; padding: 8px 20px;
    background: #fff; border-bottom: 1px solid #e2e4e7; flex-shrink: 0;
  }
  #legend .chip {
    display: flex; align-items: center; gap: 4px; font-size: 11px;
    padding: 2px 8px; border-radius: 999px; cursor: pointer;
    border: 1px solid transparent;
  }
  #legend .chip:hover { border-color: #d5d8dc; }
  #legend .chip.active { border-color: var(--dark); font-weight: 600; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #legend .chip .n { color: #9a98a3; font-size: 10px; }
  main { flex: 1; display: flex; min-height: 0; position: relative; }
  #canvasWrap { flex: 1; position: relative; min-width: 0; }
  #cv { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
  #resetView {
    position: absolute; top: 12px; right: 12px; z-index: 6;
    font-size: 12px; padding: 4px 12px; border-radius: 999px;
    border: 1px solid #e2e4e7; background: #fff; color: var(--dark); cursor: pointer;
    box-shadow: 0 1px 6px rgba(105, 103, 115, .12);
  }
  #axisNote {
    position: absolute; right: 12px; bottom: 10px; z-index: 4;
    font-size: 11px; color: #b5b3bd; pointer-events: none;
  }
  .mobOnly { display: none; }
  #panel {
    width: 360px; flex-shrink: 0; background: #fff; border-left: 1px solid #e2e4e7;
    padding: 20px; overflow-y: auto;
  }
  #panel .drawerHandle { display: none; }
  #panel .placeholder { color: #9a98a3; font-size: 13px; margin-top: 40px; text-align: center; line-height: 2; }
  #panel .clusterChip {
    display: inline-block; font-size: 12px; color: #fff;
    padding: 2px 10px; border-radius: 999px; margin-bottom: 12px;
  }
  #panel h2 { font-size: 17px; line-height: 1.5; margin-bottom: 4px; }
  #panel .author { font-size: 13px; color: var(--blue); margin-bottom: 10px; font-weight: 600; }
  #panel .facts { font-size: 12px; color: #9a98a3; margin-bottom: 14px; line-height: 1.8; }
  #panel .facts .tag {
    display: inline-block; background: var(--light); border-radius: 4px;
    padding: 0 6px; margin-right: 4px; color: var(--dark);
  }
  #panel .content { margin-bottom: 14px; border-left: 3px solid var(--yellow); padding-left: 12px; }
  #panel .content .row {
    display: flex; gap: 0 1.8em;
    font-size: 14px; line-height: 2.0; letter-spacing: 1px;
  }
  #panel .fineLead { font-size: 11px; color: #9a98a3; margin-bottom: 4px; }
  #panel .fineChips {
    display: flex; flex-wrap: wrap; gap: 4px 6px; margin-bottom: 12px;
    padding-bottom: 10px; border-bottom: 1px dashed #e2e4e7;
  }
  #panel .fineChips .fc {
    font-size: 11px; padding: 1px 8px; border-radius: 999px; cursor: pointer;
    background: var(--light); color: var(--dark); border: 1px solid transparent;
  }
  #panel .fineChips .fc:hover { border-color: #d5d8dc; }
  #panel .fineChips .fc.active { border-color: var(--dark); font-weight: 600; }
  #panel .fineChips .fc .n { color: #9a98a3; margin-left: 2px; }
  #panel .bio {
    font-size: 12px; line-height: 1.9; color: #7b7987;
    border-top: 1px dashed #e2e4e7; padding-top: 12px;
  }
  #panel .bio b { color: var(--dark); }
  #panel .bio .toggle {
    color: var(--blue); cursor: pointer; margin-left: 6px; user-select: none;
  }
  #panel .bio .toggle:hover { text-decoration: underline; }
  #panel .locked {
    margin-top: 12px; font-size: 12px; color: var(--red);
    border-top: 1px dashed #e2e4e7; padding-top: 10px;
  }
  #panel .loading { font-size: 12px; color: #9a98a3; margin-top: 16px; }

  /* 漫游路线条 */
  #panel .routeBar {
    background: var(--light); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 14px; font-size: 12px; line-height: 1.8;
  }
  #panel .routeBar .rt { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
  #panel .routeBar .rt .pos { color: #9a98a3; font-weight: 400; }
  #panel .routeBar .rn { color: #7b7987; margin: 2px 0 8px; }
  #panel .routeBar .rops span {
    display: inline-block; padding: 1px 12px; border-radius: 999px; cursor: pointer;
    background: #fff; border: 1px solid #e2e4e7; margin-right: 6px;
  }
  #panel .routeBar .rops span.dis { opacity: .35; pointer-events: none; }

  /* 附近的诗 */
  #panel .nearby { border-top: 1px dashed #e2e4e7; margin-top: 14px; padding-top: 12px; }
  #panel .nearby > b { font-size: 13px; display: block; margin-bottom: 8px; }
  #panel .nearby .grp { font-size: 11px; color: #9a98a3; margin: 8px 0 3px; }
  #panel .nearby .nb {
    font-size: 12px; line-height: 1.9; cursor: pointer; border-radius: 6px;
    padding: 1px 6px; display: flex; justify-content: space-between; gap: 8px;
  }
  #panel .nearby .nb:hover { background: var(--light); }
  #panel .nearby .nb .bt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .nearby .nb .ba { color: var(--blue); flex-shrink: 0; }

  /* 分享诗卡 */
  #panel .shareBtn {
    display: inline-block; margin-top: 12px; font-size: 12px; cursor: pointer;
    padding: 4px 14px; border-radius: 999px; background: var(--dark); color: var(--light);
  }
  #panel .shareBtn:active { opacity: .8; }
  #shareModal {
    position: fixed; inset: 0; z-index: 50; background: rgba(105, 103, 115, .55);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  #shareModal img {
    max-width: min(86vw, 450px); max-height: 76vh; border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .25); background: #fff;
  }
  #shareModal .ops { display: flex; gap: 12px; }
  #shareModal .ops a, #shareModal .ops span {
    font-size: 13px; padding: 6px 18px; border-radius: 999px; cursor: pointer;
    background: #fff; color: var(--dark); text-decoration: none;
  }
  #shareModal .hint { font-size: 11px; color: rgba(255,255,255,.85); }

  /* 左下角缩略星图 */
  #minimap {
    position: absolute; left: 16px; bottom: 16px; z-index: 5;
    background: #fff; border: 1px solid #e2e4e7; border-radius: 10px;
    padding: 8px 10px 6px; box-shadow: 0 2px 10px rgba(105, 103, 115, .12);
  }
  #minimap .mmTitle { font-size: 11px; color: #9a98a3; margin-bottom: 4px; text-align: center; }
  #minimap canvas { display: block; cursor: pointer; }

  @media (max-width: 700px) {
    body { height: 100dvh; overflow: hidden; }
    header { padding: 9px 12px; gap: 8px; }
    header h1 {
      min-width: 0; flex: 0 1 auto; overflow: hidden; white-space: nowrap;
      text-overflow: ellipsis; font-size: 15px; line-height: 1.2; letter-spacing: 0;
    }
    header .sub {
      flex: 1; overflow: hidden; text-overflow: ellipsis;
      font-size: 10px; white-space: nowrap;
    }
    #routeSel { font-size: 11px; padding: 2px 6px; max-width: 96px; }
    #legend { max-height: 84px; overflow-y: auto; padding: 6px 10px; gap: 3px 5px; }
    #legend .chip { font-size: 10px; padding: 2px 6px; }
    main { display: block; }
    #canvasWrap { position: absolute; inset: 0; }
    #axisNote { right: 10px; bottom: 66px; font-size: 10px; }
    #resetView { top: 10px; right: 10px; }
    /* 详情变底部抽屉：收起时露出把手一条，点把手展开 */
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      width: auto; min-height: 0; max-height: 62dvh;
      overflow-y: auto;
      border-left: 0; border-top: 1px solid #e2e4e7;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -4px 18px rgba(105, 103, 115, .18);
      padding: 6px 14px calc(16px + env(safe-area-inset-bottom, 0px));
      transform: translateY(calc(100% - 58px));
      transition: transform .25s ease;
    }
    #panel.open { transform: none; }
    #panel .drawerHandle {
      display: flex; justify-content: center;
      padding: 4px 0 10px; cursor: pointer;
    }
    #panel .drawerHandle i { width: 38px; height: 4px; border-radius: 2px; background: #d5d8dc; }
    #panel .placeholder { margin-top: 10px; }
    /* 抽屉上方悬停星图 */
    #minimap { position: fixed; left: 10px; bottom: 66px; z-index: 15; }
    #panel.open ~ #minimap { visibility: hidden; }
    .deskOnly { display: none; }
    .mobOnly { display: inline; }
  }
</style>
</head>
<body>
<header>
  <h1>唐诗地图</h1>
  <span class="sub" id="sub">加载中…</span>
  <select id="routeSel"><option value="">漫游路线…</option></select>
</header>
<div id="legend"></div>
<main>
  <div id="canvasWrap"><canvas id="cv"></canvas><button id="resetView" hidden>回到全图</button><div id="axisNote">点位距离 = 语义相似度 · 坐标轴无独立含义<span class="deskOnly"> · 滚轮缩放 / 拖拽平移 / 双击放大</span><span class="mobOnly"> · 单指拖动 / 双指缩放</span></div></div>
  <div id="panel"><div class="drawerHandle"><i></i></div><div class="placeholder">不知道读什么时，就来这里走走<br>每个点是一首诗，离得越近，意趣越近<br><span class="deskOnly">移动鼠标查看，</span>点击一点，读一首</div></div>
  <div id="minimap" hidden><div class="mmTitle">附近的诗 · 最近 10 首</div><canvas id="mmcv"></canvas></div>
</main>
<div id="shareModal" hidden></div>
<script>
// 木鸟配色派生的 20 主题色
const MACRO_COLORS = [
  "#F19A97", "#77AAC2", "#79D9CE", "#FCD765", "#8B87A0",
  "#E8847F", "#5C93AF", "#5CC8BB", "#E8C24A", "#696773",
  "#F5B3AE", "#99C2D4", "#9CE6DD", "#E5B93E", "#57526B",
  "#C97B72", "#3F7A96", "#4BA99E", "#D9A05B", "#9E99B3",
];

let POEMS = [];       // 轻量点位: {i,t,a,tx,ty,m,f}
let MACRO_NAMES = []; // 主题 id -> 名称（已去数字前缀）
let MACROS = [];      // /api/points 返回的主题完整信息（含 fines）
let FINE_MEMBERS = {};// 细类 id -> [点位下标]
let N_MACRO = 0;

const IS_MOBILE = window.matchMedia && matchMedia("(max-width: 700px)").matches;
// 主题名形如 "0 赠别咏怀"，展示层去掉数字前缀（内部 id 不变）
const dispName = s => (s || "").replace(/^\d+\s*/, "");

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const wrap = document.getElementById("canvasWrap");
const panel = document.getElementById("panel");
const resetBtn = document.getElementById("resetView");

let hoverIdx = -1;
let lockIdx = -1;
let lockedMacro = -1;
const chips = [];

const DRAWER_HANDLE = '<div class="drawerHandle"><i></i></div>';
const PLACEHOLDER = DRAWER_HANDLE
  + '<div class="placeholder">不知道读什么时，就来这里走走<br>'
  + '每个点是一首诗，离得越近，意趣越近<br>'
  + '<span class="deskOnly">移动鼠标查看，</span>点击一点，读一首</div>';

// ---- 详情按需加载（缓存 + 防抖） ----
const detailCache = new Map();   // id -> detail
const pendingFetch = new Map();  // id -> Promise
function fetchDetail(id) {
  if (detailCache.has(id)) return Promise.resolve(detailCache.get(id));
  if (pendingFetch.has(id)) return pendingFetch.get(id);
  const p = fetch(`/api/poem?id=${id}`)
    .then(r => r.json())
    .then(d => { detailCache.set(id, d); pendingFetch.delete(id); return d; })
    .catch(() => { pendingFetch.delete(id); return null; });
  pendingFetch.set(id, p);
  return p;
}

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255,
        g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hslToHex(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)),
        m = l - c / 2;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x]; else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  const to = v => Math.round((v + m) * 255).toString(16).padStart(2, "0");
  return "#" + to(r) + to(g) + to(b);
}

let FINE_RANK = {};  // fine id -> {rank, count}，同主题内细类明暗分层
function fineColor(p) {
  const [h, s, l] = hexToHsl(MACRO_COLORS[p.m]);
  const {rank, count} = FINE_RANK[p.f];
  const spread = count > 1 ? (rank / (count - 1) - 0.5) : 0;
  const nl = Math.min(0.85, Math.max(0.3, l + spread * 0.25));
  return hslToHex(h, s, nl);
}

function fineNameOf(p) {
  const m = MACROS[p.m];
  const f = m && m.fines ? m.fines.find(x => x.id === p.f) : null;
  return f ? f.name : "";
}

// ---- 布局 ----
let scale = { k: 1, x0: 0, y0: 0, w: 0, h: 0 };
// 视图变换：在 fit 结果之上做缩放/平移（屏幕空间）
let view = { k: 1, ox: 0, oy: 0 };

function fitScale() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const pad = 30;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of POEMS) {
    if (p.tx < minX) minX = p.tx; if (p.tx > maxX) maxX = p.tx;
    if (p.ty < minY) minY = p.ty; if (p.ty > maxY) maxY = p.ty;
  }
  const k = Math.min((w - 2 * pad) / (maxX - minX), (h - 2 * pad) / (maxY - minY));
  scale = {
    k, w, h,
    x0: pad - minX * k + ((w - 2 * pad) - (maxX - minX) * k) / 2,
    y0: pad + maxY * k + ((h - 2 * pad) - (maxY - minY) * k) / 2,
  };
}
function toScreen(p) {
  const bx = scale.x0 + p.tx * scale.k, by = scale.y0 - p.ty * scale.k;
  return [view.ox + bx * view.k, view.oy + by * view.k];
}

function syncResetBtn() {
  resetBtn.hidden = Math.abs(view.k - 1) < 1e-3 && Math.abs(view.ox) < 1 && Math.abs(view.oy) < 1;
}
function zoomAt(mx, my, factor) {
  const k2 = Math.min(60, Math.max(0.6, view.k * factor));
  const r = k2 / view.k;
  view.ox = mx - (mx - view.ox) * r;
  view.oy = my - (my - view.oy) * r;
  view.k = k2;
  syncResetBtn();
  draw();
}
function panBy(dx, dy) {
  view.ox += dx; view.oy += dy;
  syncResetBtn();
  draw();
}
function resetView() {
  view = { k: 1, ox: 0, oy: 0 };
  syncResetBtn();
  draw();
}
resetBtn.onclick = resetView;

// 平滑飞到某首诗（巡游切站用）；用 setTimeout 而非 rAF，后台标签页也能走完
let viewAnim = null;
function focusPoem(idx) {
  const p = POEMS[idx];
  const bx = scale.x0 + p.tx * scale.k, by = scale.y0 - p.ty * scale.k;
  const k2 = Math.max(view.k, 2.2);
  const to = { k: k2, ox: scale.w / 2 - bx * k2, oy: scale.h / 2 - by * k2 };
  const from = { ...view };
  const t0 = performance.now();
  if (viewAnim) clearTimeout(viewAnim);
  const step = () => {
    const u = Math.min(1, (performance.now() - t0) / 450);
    const e = 1 - Math.pow(1 - u, 3);   // easeOutCubic
    view = {
      k: from.k + (to.k - from.k) * e,
      ox: from.ox + (to.ox - from.ox) * e,
      oy: from.oy + (to.oy - from.oy) * e,
    };
    syncResetBtn();
    draw();
    if (u < 1) viewAnim = setTimeout(step, 16);
  };
  step();
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = wrap.clientWidth * dpr;
  cv.height = wrap.clientHeight * dpr;
  cv.style.width = wrap.clientWidth + "px";
  cv.style.height = wrap.clientHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fitScale();
  draw();
}

// ---- 绘制 ----
function draw() {
  ctx.clearRect(0, 0, scale.w, scale.h);
  const locking = lockedMacro >= 0;
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < POEMS.length; i++) {
      const p = POEMS[i];
      const hot = !locking || p.m === lockedMacro;
      if ((pass === 1) !== hot) continue;
      const [x, y] = toScreen(p);
      ctx.globalAlpha = locking && !hot ? 0.08 : 0.85;
      ctx.fillStyle = fineColor(p);
      ctx.beginPath();
      ctx.arc(x, y, locking && hot ? 3 : 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (const [idx, r] of [[hoverIdx, 5], [lockIdx, 8]]) {
    if (idx < 0) continue;
    const [x, y] = toScreen(POEMS[idx]);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fineColor(POEMS[idx]);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
  }
  // 巡游中的站点：虚线路径 + 编号圆点
  if (tour) {
    const pts = tour.route.stops.map(s => ID2IDX[s.poemId]).filter(i => i !== undefined);
    ctx.beginPath();
    pts.forEach((i, n) => {
      const [x, y] = toScreen(POEMS[i]);
      if (n === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = "rgba(105, 103, 115, .4)";
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    pts.forEach((i, n) => {
      const [x, y] = toScreen(POEMS[i]);
      const cur = n === tour.pos;
      ctx.beginPath();
      ctx.arc(x, y, cur ? 11 : 8, 0, Math.PI * 2);
      ctx.fillStyle = cur ? "#696773" : "rgba(255, 255, 255, .92)";
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "#696773";
      ctx.stroke();
      ctx.fillStyle = cur ? "#EFF1F3" : "#696773";
      ctx.font = "10px sans-serif";
      ctx.fillText(String(n + 1), x, y);
    });
  }
}

// ---- 漫游路线 ----
let ROUTES = [];
let tour = null;   // {route, pos} 巡游中

function routeBarHtml() {
  if (!tour) return "";
  const r = tour.route, n = r.stops.length, stop = r.stops[tour.pos];
  return `<div class="routeBar">`
    + `<div class="rt"><span>漫游 · ${r.title}</span><span class="pos">${tour.pos + 1} / ${n}</span></div>`
    + `<div class="rn">${stop.note}</div>`
    + `<div class="rops">`
    + `<span data-rope="prev"${tour.pos <= 0 ? ' class="dis"' : ""}>上一站</span>`
    + `<span data-rope="next"${tour.pos >= n - 1 ? ' class="dis"' : ""}>下一站</span>`
    + `<span data-rope="exit">退出路线</span>`
    + `</div></div>`;
}

function buildRouteMenu() {
  const sel = document.getElementById("routeSel");
  for (const r of ROUTES) {
    const o = document.createElement("option");
    o.value = r.id;
    o.textContent = r.title;
    sel.appendChild(o);
  }
  sel.onchange = () => {
    if (sel.value) startTour(sel.value);
    sel.value = "";
  };
}

function gotoStop() {
  const stop = tour.route.stops[tour.pos];
  const idx = ID2IDX[stop.poemId];
  if (idx === undefined) return;
  lock(idx);
  focusPoem(idx);
}
function startTour(id) {
  const route = ROUTES.find(r => r.id === id);
  if (!route) return;
  tour = { route, pos: 0 };
  gotoStop();
}
function tourPrev() {
  if (!tour || tour.pos <= 0) return;
  tour.pos--;
  gotoStop();
}
function tourNext() {
  if (!tour || tour.pos >= tour.route.stops.length - 1) return;
  tour.pos++;
  gotoStop();
}
function exitTour() {
  tour = null;
  if (lockIdx >= 0) showPoem(lockIdx, true);  // 重渲染去掉路线条
  draw();
}

// ---- 附近的诗（基于 t-SNE 坐标距离，纯前端计算） ----
let currentNearby = null;

function computeNearby(i) {
  const c = POEMS[i];
  const dists = [];
  for (let j = 0; j < POEMS.length; j++) {
    if (j === i) continue;
    const dx = POEMS[j].tx - c.tx, dy = POEMS[j].ty - c.ty;
    dists.push([dx * dx + dy * dy, j]);
  }
  dists.sort((a, b) => a[0] - b[0]);
  const nearest10 = dists.slice(0, 10).map(([, j]) => j);
  const samePoet = dists.filter(([, j]) => POEMS[j].a === c.a).slice(0, 3).map(([, j]) => j);
  const finePool = (FINE_MEMBERS[c.f] || []).filter(j => j !== i);
  const macroPool = (MACRO_MEMBERS[c.m] || []).filter(j => j !== i);
  return {
    center: i,
    nearest10,
    nearest5: nearest10.slice(0, 5),
    samePoet,
    sameFine: finePool.length ? finePool[Math.floor(Math.random() * finePool.length)] : -1,
    sameMacro: macroPool.length ? macroPool[Math.floor(Math.random() * macroPool.length)] : -1,
  };
}

function nearbyHtml(nb) {
  const seen = new Set([nb.center]);
  const item = j => {
    if (j < 0 || seen.has(j)) return "";
    seen.add(j);
    return `<div class="nb" data-i="${j}"><span class="bt">《${POEMS[j].t}》</span><span class="ba">${POEMS[j].a}</span></div>`;
  };
  const group = (label, idxs) => {
    const items = idxs.map(item).filter(Boolean).join("");
    return items ? `<div class="grp">${label}</div>${items}` : "";
  };
  const sameFineLabel = nb.sameFine >= 0 && fineNameOf(POEMS[nb.sameFine])
    ? `同为「${fineNameOf(POEMS[nb.sameFine])}」的一首` : "同一小类的另一首";
  return `<div class="nearby"><b>附近的诗</b>`
    + group("语义最接近的 5 首", nb.nearest5)
    + group("同诗人的相似作品", nb.samePoet)
    + (nb.sameFine >= 0 ? `<div class="grp">${sameFineLabel}</div>${item(nb.sameFine)}` : "")
    + (nb.sameMacro >= 0 ? `<div class="grp">同主题的另一首</div>${item(nb.sameMacro)}` : "")
    + `</div>`;
}

function bindNearby() {
  panel.querySelectorAll(".nearby .nb").forEach(el => {
    el.onclick = () => lock(Number(el.dataset.i));
  });
}

// ---- 左下角缩略星图 ----
const MM = 200;              // 星图边长（CSS 像素）
const mmDiv = document.getElementById("minimap");
const mmcv = document.getElementById("mmcv");
const mmCtx = mmcv.getContext("2d");
let mmPts = [];              // 星图上各点 {x, y, idx}，供点击命中

function drawMinimap() {
  const nb = currentNearby;
  if (!nb) { mmDiv.hidden = true; return; }
  mmDiv.hidden = false;
  const dpr = window.devicePixelRatio || 1;
  mmcv.width = MM * dpr; mmcv.height = MM * dpr;
  mmcv.style.width = MM + "px"; mmcv.style.height = MM + "px";
  mmCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mmCtx.clearRect(0, 0, MM, MM);

  const c = POEMS[nb.center];
  const rel = nb.nearest10.map(j => ({ j, dx: POEMS[j].tx - c.tx, dy: POEMS[j].ty - c.ty }));
  const maxd = Math.max(...rel.map(p => Math.hypot(p.dx, p.dy)), 1e-9);
  const k = (MM / 2 - 14) / maxd;   // 最远的点缩放到边缘内
  const cx = MM / 2, cy = MM / 2;
  // 边：中心到各点，长度即距离（近短远长）
  mmPts = [];
  for (const p of rel) {
    const x = cx + p.dx * k, y = cy - p.dy * k;
    mmPts.push({ x, y, idx: p.j });
    mmCtx.beginPath();
    mmCtx.moveTo(cx, cy);
    mmCtx.lineTo(x, y);
    mmCtx.strokeStyle = fineColor(POEMS[p.j]);
    mmCtx.globalAlpha = 0.4;
    mmCtx.lineWidth = 1;
    mmCtx.stroke();
  }
  mmCtx.globalAlpha = 1;
  for (const p of mmPts) {
    mmCtx.beginPath();
    mmCtx.arc(p.x, p.y, 3.4, 0, Math.PI * 2);
    mmCtx.fillStyle = fineColor(POEMS[p.idx]);
    mmCtx.fill();
  }
  // 中心点放大 + 白描边
  mmCtx.beginPath();
  mmCtx.arc(cx, cy, 6, 0, Math.PI * 2);
  mmCtx.fillStyle = fineColor(c);
  mmCtx.fill();
  mmCtx.lineWidth = 2;
  mmCtx.strokeStyle = "#fff";
  mmCtx.stroke();
}

mmcv.addEventListener("click", e => {
  const rect = mmcv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let best = -1, bestD = 100;  // 10px 内命中
  for (const p of mmPts) {
    const d = (p.x - mx) * (p.x - mx) + (p.y - my) * (p.y - my);
    if (d < bestD) { bestD = d; best = p.idx; }
  }
  if (best >= 0) lock(best);
});

// ---- 分享诗卡（Canvas 离屏绘制，900x1200 适配小红书/朋友圈） ----
const shareModal = document.getElementById("shareModal");
let DATA_BOUNDS = null;  // 全体点位坐标范围（诗卡小地图用）

function fitText(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && g.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t + "…";
}

function makeShareCard(d, url) {
  const W = 900, H = 1200;
  const card = document.createElement("canvas");
  card.width = W; card.height = H;
  const g = card.getContext("2d");
  const accent = MACRO_COLORS[d.macro];

  g.fillStyle = "#EFF1F3"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#fff";
  if (g.roundRect) { g.beginPath(); g.roundRect(36, 36, W - 72, H - 72, 24); g.fill(); }
  else g.fillRect(36, 36, W - 72, H - 72);

  g.textAlign = "center";
  // 头部：主题 · 细类
  const headText = `${dispName(d.macro_name)} · ${d.fine_name}`;
  g.font = "22px 'PingFang SC', sans-serif";
  const hw = g.measureText(headText).width;
  g.fillStyle = accent;
  g.beginPath(); g.arc(W / 2 - hw / 2 - 18, 96, 8, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#9a98a3";
  g.fillText(headText, W / 2 + 10, 104);

  // 诗名 / 作者
  g.fillStyle = "#696773";
  g.font = "bold 42px 'PingFang SC', serif";
  g.fillText(fitText(g, `《${d.title}》`, W - 160), W / 2, 180);
  g.font = "26px 'PingFang SC', sans-serif";
  g.fillStyle = "#77AAC2";
  g.fillText(`${d.author}${d.era ? " · " + d.era : ""}`, W / 2, 228);

  // 正文一联（前两句）
  const clauses = d.paragraphs.join("").split(/(?<=[，。！？；])/).filter(s => s.trim()).slice(0, 2);
  g.font = "32px 'PingFang SC', serif";
  g.fillStyle = "#57526B";
  clauses.forEach((c, i) => g.fillText(c, W / 2, 300 + i * 52));

  // 语义地图缩略：全体压暗 + 邻近 10 首 + 当前高亮
  const bx = 110, by = 410, bw = 680, bh = 400;
  g.fillStyle = "#F7F8F9";
  if (g.roundRect) { g.beginPath(); g.roundRect(bx, by, bw, bh, 16); g.fill(); }
  else g.fillRect(bx, by, bw, bh);
  if (!DATA_BOUNDS) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of POEMS) {
      if (p.tx < x0) x0 = p.tx; if (p.tx > x1) x1 = p.tx;
      if (p.ty < y0) y0 = p.ty; if (p.ty > y1) y1 = p.ty;
    }
    DATA_BOUNDS = { x0, x1, y0, y1 };
  }
  const B = DATA_BOUNDS, pad = 16;
  const k = Math.min((bw - 2 * pad) / (B.x1 - B.x0), (bh - 2 * pad) / (B.y1 - B.y0));
  const ox = bx + pad - B.x0 * k + ((bw - 2 * pad) - (B.x1 - B.x0) * k) / 2;
  const oy = by + pad + B.y1 * k + ((bh - 2 * pad) - (B.y1 - B.y0) * k) / 2;
  const pt = p => [ox + p.tx * k, oy - p.ty * k];
  g.fillStyle = "rgba(105,103,115,.16)";
  for (const p of POEMS) {
    const [x, y] = pt(p);
    g.fillRect(x, y, 1.6, 1.6);
  }
  const center = POEMS[ID2IDX[d.id]];
  const [ccx, ccy] = pt(center);
  if (currentNearby) {
    for (const j of currentNearby.nearest10) {
      const [x, y] = pt(POEMS[j]);
      g.strokeStyle = fineColor(POEMS[j]);
      g.globalAlpha = 0.55; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(ccx, ccy); g.lineTo(x, y); g.stroke();
      g.globalAlpha = 1;
      g.fillStyle = fineColor(POEMS[j]);
      g.beginPath(); g.arc(x, y, 4.5, 0, Math.PI * 2); g.fill();
    }
  }
  g.fillStyle = accent;
  g.beginPath(); g.arc(ccx, ccy, 9, 0, Math.PI * 2); g.fill();
  g.lineWidth = 4; g.strokeStyle = "#fff";
  g.beginPath(); g.arc(ccx, ccy, 9, 0, Math.PI * 2); g.stroke();
  g.font = "18px 'PingFang SC', sans-serif";
  g.fillStyle = "#9a98a3";
  g.fillText("在语义地图中的位置", W / 2, by + bh - 12);

  // 相似的诗
  g.textAlign = "left";
  g.font = "bold 24px 'PingFang SC', sans-serif";
  g.fillStyle = "#696773";
  g.fillText("相似的诗", 110, 868);
  g.font = "23px 'PingFang SC', sans-serif";
  let sy = 908;
  for (const j of (currentNearby ? currentNearby.nearest5 : [])) {
    g.fillStyle = fineColor(POEMS[j]);
    g.beginPath(); g.arc(122, sy - 7, 5, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#57526B";
    g.fillText(fitText(g, `《${POEMS[j].t}》 ${POEMS[j].a}`, W - 240), 140, sy);
    sy += 37;
  }

  // 页脚：来源 + 链接
  g.textAlign = "center";
  g.strokeStyle = "#e2e4e7"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(110, 1092); g.lineTo(W - 110, 1092); g.stroke();
  g.font = "bold 22px 'PingFang SC', sans-serif";
  g.fillStyle = "#696773";
  g.fillText("来自 · 唐诗地图", W / 2, 1124);
  g.font = "17px 'PingFang SC', sans-serif";
  g.fillStyle = "#9a98a3";
  g.fillText(fitText(g, url, W / 2, 1152));
  return card;
}

// ---- 锁定/解锁 ----
let MACRO_MEMBERS = [];
let ID2IDX = {};   // 诗 id -> 点位下标（URL 路由用）

// URL 路由：锁定时把诗 id 写入 hash，支持后退/刷新直达（容器内 pushState 可能不可用，静默降级）
function navTo(hash) {
  try { history.pushState(null, "", hash); } catch (e) { /* 离线容器忽略 */ }
}
let firstSync = true;
function recommendIdx() {
  // 移动端默认推荐：优先名作，兜底随机
  const favs = ["静夜思", "登鹳雀楼", "黄鹤楼送孟浩然之广陵", "赋得古原草送别", "相思", "春晓"];
  for (const t of favs) {
    const idx = POEMS.findIndex(p => p.t === t);
    if (idx >= 0) return idx;
  }
  return Math.floor(Math.random() * POEMS.length);
}
function syncFromURL() {
  const m = location.hash.match(/^#(\d+)$/);
  const idx = m ? ID2IDX[Number(m[1])] : undefined;
  if (idx !== undefined && idx !== lockIdx) lock(idx, false);
  else if (idx === undefined && lockIdx >= 0) unlock(false);
  else if (idx === undefined && firstSync && IS_MOBILE) {
    lock(recommendIdx(), false);   // 移动端进来先推荐一首
    panel.classList.remove("open"); // 抽屉保持收起，只露把手
  }
  firstSync = false;
}

function lock(i, push = true) {
  // 巡游中点到站点以外的诗：自动退出路线
  if (tour && i !== ID2IDX[tour.route.stops[tour.pos].poemId]) tour = null;
  lockIdx = i;
  lockedMacro = POEMS[i].m;
  currentNearby = computeNearby(i);
  if (push) navTo("#" + POEMS[i].i);
  chips.forEach((chip, m) => chip.classList.toggle("active", m === lockedMacro));
  showPoem(i, true);
  if (IS_MOBILE) panel.classList.add("open");
  drawMinimap();
  draw();
}
function unlock(push = true) {
  tour = null;
  lockIdx = -1; lockedMacro = -1;
  currentNearby = null;
  mmDiv.hidden = true;
  if (push) navTo("#");
  chips.forEach(chip => chip.classList.remove("active"));
  panel.classList.remove("open");
  if (hoverIdx >= 0) showPoem(hoverIdx, false);
  else panel.innerHTML = PLACEHOLDER;
  draw();
}
window.addEventListener("popstate", syncFromURL);
window.addEventListener("hashchange", syncFromURL);

// ---- 交互 ----
function nearest(mx, my) {
  let best = -1, bestD = 64;
  for (let i = 0; i < POEMS.length; i++) {
    const [x, y] = toScreen(POEMS[i]);
    const d = (x - mx) * (x - mx) + (y - my) * (y - my);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// 指针交互：悬停（鼠标）、点按锁定、拖拽平移、双指缩放
const ptrs = new Map();     // pointerId -> {x, y, x0, y0}
let dragMoved = false;
let pinchD = 0, pinchMid = null;
let lastTap = { t: 0, i: -2 };  // 双击识别：避免双击被当成两次点按

cv.addEventListener("pointerdown", e => {
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件无真实指针可捕获 */ }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY });
  dragMoved = false;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinchD = Math.hypot(a.x - b.x, a.y - b.y);
    pinchMid = null;
    dragMoved = true;  // 双指操作不算点按
  }
});

cv.addEventListener("pointermove", e => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (!ptrs.has(e.pointerId)) {
    if (e.pointerType !== "mouse") return;  // 悬停只对鼠标
    const i = nearest(mx, my);
    if (i === hoverIdx) return;
    hoverIdx = i;
    cv.style.cursor = i >= 0 ? "pointer" : "crosshair";
    draw();
    if (lockIdx < 0 && i >= 0) showPoem(i, false);
    return;
  }
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: prev.x0, y0: prev.y0 });
  if (ptrs.size === 1) {
    if (!dragMoved && Math.hypot(e.clientX - prev.x0, e.clientY - prev.y0) > 4) {
      dragMoved = true;
      hoverIdx = -1;
      cv.style.cursor = "grabbing";
    }
    if (dragMoved) panBy(e.clientX - prev.x, e.clientY - prev.y);
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const midX = (a.x + b.x) / 2 - rect.left, midY = (a.y + b.y) / 2 - rect.top;
    if (pinchD > 0 && d > 0) zoomAt(midX, midY, d / pinchD);
    if (pinchMid) panBy(midX - pinchMid.x, midY - pinchMid.y);
    pinchD = d;
    pinchMid = { x: midX, y: midY };
  }
});

function endPointer(e) {
  const wasDrag = dragMoved;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) { pinchD = 0; pinchMid = null; }
  if (ptrs.size === 1) {
    // 双指变单指：重置基准，避免视图跳动
    const [id, p] = [...ptrs.entries()][0];
    ptrs.set(id, { x: p.x, y: p.y, x0: p.x, y0: p.y });
    dragMoved = true;
  }
  if (ptrs.size > 0) return;
  cv.style.cursor = "crosshair";
  if (wasDrag) return;
  // 点按：命中锁定 / 再点取消
  const rect = cv.getBoundingClientRect();
  const i = nearest(e.clientX - rect.left, e.clientY - rect.top);
  const now = Date.now();
  if (now - lastTap.t < 350 && i === lastTap.i) { lastTap.t = 0; return; }  // 双击交给 dblclick
  lastTap = { t: now, i };
  if (lockIdx >= 0 && (i === lockIdx || i < 0)) unlock();
  else if (i >= 0) lock(i);
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

cv.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * 0.0016));
}, { passive: false });

cv.addEventListener("dblclick", e => {
  const rect = cv.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, 1.6);
});

cv.addEventListener("pointerleave", () => { hoverIdx = -1; draw(); });

window.addEventListener("resize", resize);

// ---- 初始化 ----
fetch("/api/points").then(r => r.json()).then(data => {
  MACRO_NAMES = data.macros.map(m => dispName(m.name));
  MACROS = data.macros;
  N_MACRO = data.macros.length;
  POEMS = data.points.map(([i, t, a, tx, ty, m, f]) => ({ i, t, a, tx, ty, m, f }));

  document.getElementById("sub").textContent =
    `${POEMS.length} 首 · Qwen3-Embedding-0.6B · KMeans k=100→20 · PCA→t-SNE · SQLite`;

  MACRO_MEMBERS = Array.from({ length: N_MACRO }, () => []);
  POEMS.forEach((p, idx) => {
    MACRO_MEMBERS[p.m].push(idx);
    (FINE_MEMBERS[p.f] = FINE_MEMBERS[p.f] || []).push(idx);
    ID2IDX[p.i] = idx;
  });
  for (let m = 0; m < N_MACRO; m++) {
    const fines = [...new Set(POEMS.filter(p => p.m === m).map(p => p.f))].sort((a, b) => a - b);
    fines.forEach((f, r) => FINE_RANK[f] = { rank: r, count: fines.length });
  }

  const legend = document.getElementById("legend");
  const sorted = [...data.macros].sort((a, b) => b.count - a.count);
  for (const m of sorted) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<span class="dot" style="background:${MACRO_COLORS[m.id]}"></span>${dispName(m.name)}<span class="n">${m.count}</span>`;
    chip.onclick = () => {
      if (lockedMacro === m.id) { unlock(); return; }
      const members = MACRO_MEMBERS[m.id];
      lock(members[Math.floor(Math.random() * members.length)]);
    };
    legend.appendChild(chip);
    chips[m.id] = chip;  // chips 按下标=主题 id 访问，与显示顺序无关
  }
  resize();
  syncFromURL();  // 支持刷新/分享链接直达某首诗
});
</script>
